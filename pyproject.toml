[project]
name = "worldsignal"
version = "0.13.0"
description = "World Signal - haber toplama, birleştirme ve özetleme masaüstü uygulaması"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "httpx>=0.28",
    "feedparser>=6.0.11",
    "pywebview>=5.3",
    "numpy>=2.5.3",
    "trafilatura>=2.0",
    "patchright>=1.55",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "playwright>=1.49",
    "pyinstaller>=6.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/worldsignal"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`"]
markers = [
    "network: gerçek internet erişimi gerektiren testler (varsayılan olarak atlanır)",
    "e2e: derlenmiş arayüzü gerçek tarayıcıda çalıştıran uçtan uca testler",
    "desktop: ekranda gerçek Windows bildirimi gösteren testler (varsayılan olarak atlanır)",
]
